# Descarcă istoricul Forex de la Dukascopy (bid/ask reale, din 2003). Dukascopy respinge cererile prea dese (503),
# așa că mergem încet: câteva mașini în paralel, o cerere pe rând, pauze lungi la refuz.
name: APEX date Forex (Dukascopy)

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Perechi separate prin virgulă (gol = toate cele 26)'
        required: false
        default: ''
      from:
        description: 'Anul de început'
        required: false
        default: '2003'
      merge:
        description: 'Lipește peste istoricul existent (true/false)'
        required: false
        default: 'false'
      since:
        description: 'YYYY-MM: doar lunile de atunci încoace (lipite peste istoric); gol = tot istoricul'
        required: false
        default: ''
      parallel:
        description: 'Câte mașini în paralel'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.p.outputs.pairs }}
    steps:
      - id: p
        run: |
          ALL="EURUSD,GBPUSD,AUDUSD,NZDUSD,USDJPY,USDCAD,USDCHF,EURJPY,GBPJPY,AUDJPY,EURGBP,EURCHF,EURAUD,EURCAD,EURNZD,GBPAUD,GBPCAD,GBPCHF,GBPNZD,AUDCAD,AUDNZD,AUDCHF,NZDJPY,CADJPY,CHFJPY,NZDCAD"
          P="${{ github.event.inputs.pairs }}"; [ -z "$P" ] && P="$ALL"
          echo "pairs=$(echo "$P" | python3 -c 'import sys,json; print(json.dumps([x.strip() for x in sys.stdin.read().split(",") if x.strip()]))')" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.parallel || '4') }}
      matrix:
        pair: ${{ fromJSON(needs.plan.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descarcă ${{ matrix.pair }}
        env:
          DK_NO_CURRENT: '1'
        run: |
          M=""; if [ "${{ github.event.inputs.merge }}" = "true" ]; then M="--merge"; fi
          if [ -n "${{ github.event.inputs.since }}" ]; then M="--since ${{ github.event.inputs.since }}"; fi
          python3 scripts/dukascopy.py --pairs ${{ matrix.pair }} --from ${{ github.event.inputs.from || '2003' }} --out data/fx/dk $M
      - name: Completează anul curent din Yahoo (rapid)
        run: python3 scripts/yahoo_recent.py --pairs ${{ matrix.pair }} --since $(date -u +%Y)-01-01 --out data/fx/dk || true
      - name: Salvează
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add data/fx/dk
          if git diff --cached --quiet; then echo "Nimic nou."; exit 0; fi
          git commit -m "date Forex Dukascopy ${{ matrix.pair }} $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
