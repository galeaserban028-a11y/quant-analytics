# Descarcă istoricul Forex de la Dukascopy (bid/ask reale, din 2003), câte o pereche pe mașină (în paralel),
# pentru că Dukascopy încetinește cererile repetate de pe aceeași adresă.
name: APEX date Forex (Dukascopy)

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Anul de început'
        required: false
        default: '2003'
      merge:
        description: 'Doar anii recenți, lipiți peste istoricul existent (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pair: [EURUSD, GBPUSD, AUDUSD, NZDUSD, USDJPY, USDCAD, USDCHF, EURJPY, GBPJPY, AUDJPY, EURGBP, EURCHF, EURAUD, EURCAD, EURNZD, GBPAUD, GBPCAD, GBPCHF, GBPNZD, AUDCAD, AUDNZD, AUDCHF, NZDJPY, CADJPY, CHFJPY, NZDCAD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descarcă ${{ matrix.pair }}
        run: |
          M=""; if [ "${{ github.event.inputs.merge }}" = "true" ]; then M="--merge"; fi
          python3 scripts/dukascopy.py --pairs ${{ matrix.pair }} --from ${{ github.event.inputs.from || '2003' }} --out data/fx/dk $M
      - name: Salvează
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add data/fx/dk
          if git diff --cached --quiet; then echo "Nimic nou."; exit 0; fi
          git commit -m "date Forex Dukascopy ${{ matrix.pair }} $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
