# Descarcă dobânzile pe termen scurt ale celor 8 monede (FRED) pentru swap real și strategiile „carry”.
name: APEX dobânzi (FRED)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '10 2 1 * *'     # lunar, înainte de școala Academiei

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/rates.py
      - name: Salvează
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add data/fx/rates.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "dobânzi FRED $(date -u +%Y-%m)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
