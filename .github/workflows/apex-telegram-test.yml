# Diagnostic Telegram: verifică secretele și trimite un mesaj de test. Rezultatul (fără cheie / fără ID) e salvat în state/telegram_check.json.
name: APEX test Telegram

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Trimite și un semnal de test (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testează Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-check.js
          if [ "${{ github.event.inputs.sample }}" = "true" ]; then node scripts/telegram-sample.js; fi
      - name: Salvează rezultatul
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add state/telegram_check.json state/telegram_chat.enc 2>/dev/null || git add state/telegram_check.json
          git commit -m "test Telegram $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
