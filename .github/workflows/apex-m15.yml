# Istoric pe 15 MINUTE de la Dukascopy (din minute, bid/ask reale), pentru cercetarea de scalping.
# Rapid: câte O LUNĂ pe job, până la 20 de joburi în paralel; fiecare lună se salvează imediat.
name: APEX date M15 (scalping)

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Instrumente'
        required: false
        default: 'EURUSD,GBPUSD,USA500IDXUSD,DEUIDXEUR'
      from:
        description: 'Prima lună (AAAA-LL)'
        required: false
        default: '2022-01'
      to:
        description: 'Ultima lună (AAAA-LL)'
        required: false
        default: '2025-12'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.p.outputs.pairs }}
      months: ${{ steps.p.outputs.months }}
    steps:
      - id: p
        run: |
          echo "pairs=$(echo '${{ github.event.inputs.pairs }}' | python3 -c 'import sys,json; print(json.dumps([x.strip() for x in sys.stdin.read().split(",") if x.strip()]))')" >> "$GITHUB_OUTPUT"
          echo "months=$(python3 -c "
          import json
          a,b='${{ github.event.inputs.from }}','${{ github.event.inputs.to }}'
          y,m=map(int,a.split('-')); Y,Mo=map(int,b.split('-')); out=[]
          while (y,m)<=(Y,Mo):
              out.append(f'{y}-{m:02d}'); m+=1
              if m==13: y,m=y+1,1
          print(json.dumps(out))")" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pair: ${{ fromJSON(needs.plan.outputs.pairs) }}
        month: ${{ fromJSON(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descarcă ${{ matrix.pair }} ${{ matrix.month }} (M15)
        env:
          DK_PACE: '1.0'
        run: |
          Y=${{ matrix.month }}; Y=${Y%-*}; M=${{ matrix.month }}; M=$((10#${M#*-}))
          python3 scripts/dukascopy.py --tf m15 --pairs ${{ matrix.pair }} --from $Y --to $Y --month $M --out data/fx/dk
      - name: Salvează
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add data/fx/dk/m15
          if git diff --cached --quiet; then echo "Nimic nou."; exit 0; fi
          git commit -m "date M15 ${{ matrix.pair }} ${{ matrix.month }}"
          for i in $(seq 1 15); do git pull --rebase && git push && exit 0; sleep $((RANDOM % 30 + 5)); done
          exit 1
