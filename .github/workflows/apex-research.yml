# O dată pe lună: re-descarcă istoricul, refă walk-forward-ul și re-antrenează Departamentul Trend.
# Dacă avantajul a dispărut, departamentul se DEZACTIVEAZĂ automat. Rezultatul vine și pe Telegram.
name: APEX cercetare lunară

on:
  schedule:
    - cron: '30 2 1 * *'     # pe 1 ale lunii, 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apex-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Teste
        run: node --test
      - name: Walk-forward Trend (re-antrenare)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TELEGRAM: '1'
        run: node src/research/trendRun.js --refresh --apply
      - name: Salvează rezultatele
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add config/promotions.json data/research/RAPORT_TREND.md data/csv_h4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "cercetare lunară $(date -u +%Y-%m)"
          git pull --rebase --autostash
          git push
