# Școala lunară a Academiei Forex: aduce ultimele date Dukascopy, rulează viața celor 300 de agenți (3 rulări
# independente), decide elita și dacă Academia are voie să trimită semnale. Rezultatul vine și pe Telegram.
name: APEX școala lunară (Academia Forex)

on:
  schedule:
    - cron: '30 2 1 * *'     # pe 1 ale lunii, 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apex-state
  cancel-in-progress: false

jobs:
  school:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Teste
        run: |
          node --test
          python3 test/python/test_dukascopy.py
      - name: Date noi (anul trecut și anul curent, lipite peste istoric)
        run: python3 scripts/dukascopy.py --all --from $(( $(date -u +%Y) - 1 )) --out data/fx/dk --merge || true
      - name: Viața agenților și elita
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TELEGRAM: '1'
        run: node src/research/academyRun.js --apply
      - name: Salvează rezultatele
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add config/promotions.json data/research/academy.json data/research/RAPORT_ACADEMIE.md data/fx/dk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "școala lunară $(date -u +%Y-%m)"
          git pull --rebase --autostash
          git push
