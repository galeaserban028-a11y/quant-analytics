# Statistica strategiei M15 pe prețurile din sursele live (Dukascopy 2026 + Hyperliquid).
name: APEX Toni statistică live

on:
  workflow_dispatch:
    inputs:
      from: { description: 'de la (statistică)', default: '2026-01-01', required: false }
      hist: { description: 'istoric de la', default: '2025-10-15', required: false }

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/toni-live-stats.js
        env:
          FROM: ${{ inputs.from }}
          HIST: ${{ inputs.hist }}
