# Aduce lumânările M15 recente de la Dukascopy în data/fx/dk/m15 (pentru cercetare pe datele noi).
name: APEX date M15 Dukascopy

on:
  workflow_dispatch:
    inputs:
      from: { description: 'de la (yyyy-mm-dd)', default: '2025-12-01', required: false }
      inst: { description: 'instrumente (gol = indicii semnalelor)', default: '', required: false }

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/dk-m15-update.js
        env:
          FROM: ${{ inputs.from }}
          INST: ${{ inputs.inst }}
      - run: |
          git config user.name "apex-bot"; git config user.email "apex-bot@users.noreply.github.com"
          git add data/fx/dk/m15
          git diff --cached --quiet || git commit -q -m "date M15 Dukascopy de la ${{ inputs.from }}"
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin main && break; sleep $((RANDOM % 10 + 3)); done
