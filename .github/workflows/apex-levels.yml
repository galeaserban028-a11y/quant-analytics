# Nivelurile zilei (VAH/VAL/POC de ieri) pentru strategia M15 pe indici.
name: APEX niveluri

on:
  workflow_dispatch:
    inputs:
      send:
        description: 'Trimite nivelurile și pe Telegram (true/false)'
        required: false
        default: 'false'

jobs:
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/levels.js ${{ github.event.inputs.send == 'true' && '--send' || '' }}
