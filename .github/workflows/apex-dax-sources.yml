# Caută o sursă gratuită cu DAX live.
name: APEX surse DAX

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/dax-sources-diag.js; node scripts/dax-sources-diag2.js
