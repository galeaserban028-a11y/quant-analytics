# Diagnostic de rețea pentru sursele de date Forex (rezultatul apare ca adnotări).
name: APEX diagnostic surse date

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Testează sursele
        run: |
          for u in \
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/00/BID_candles_hour_1.bi5" \
            "http://datafeed.dukascopy.com/datafeed/EURUSD/2024/00/BID_candles_hour_1.bi5" \
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/00/15/BID_candles_min_1.bi5" \
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/BID_candles_day_1.bi5" \
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2024/00/15/10h_ticks.bi5" \
            "https://www.histdata.com/" \
            "https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?interval=1h&range=5d" \
            "https://stooq.com/q/d/l/?s=eurusd&i=d" ; do
            r=$(curl -sS -A "Mozilla/5.0" -o /tmp/x -w "%{http_code} %{size_download}B %{time_total}s" --max-time 60 "$u" 2>&1 | tr '\n' ' ')
            echo "::notice::$u -> $r"
          done
