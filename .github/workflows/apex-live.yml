# Rulează sistemul live non-stop, din 5 în 5 minute, pe serverele GitHub (gratuit pentru repo public).
# GitHub nu respectă programările dese (le face la câteva ore), așa că folosim o buclă: un job rulează ~5h40m,
# câte un ciclu la fiecare 5 minute, apoi pornește singur următorul job. Programarea orară e plasa de siguranță.
# Trimite pe Telegram doar la evenimente: semnal nou (cu lot și stop), închidere, fază trecută, plus un mesaj zilnic la ora 9.
# Variabile opționale (Settings → Secrets and variables → Actions → Variables):
#   PROP_BALANCE = soldul real al contului (dacă diferă de cel estimat), PROP_ACCOUNT_SIZE = mărimea contului (implicit 10000),
#   PROP_FIRM = FTMO_2STEP | FUNDEDNEXT_STELLAR_2STEP | THE5ERS_HIGH_STAKES | FTMO_1STEP, PROP_PHASE = 1, 2 sau 3 (3 = finanțat),
#   PROP_CONTRACT_SIZES = mărimea contractului dacă firma ta diferă (ex. JP225=100,GER40=1),
#   PROP_RESUME = orice valoare nouă reia semnalele după frâna de urgență
name: APEX live

on:
  schedule:
    - cron: '17 * * * *'     # plasă de siguranță: dacă bucla s-a oprit, o repornește în cel mult o oră
  workflow_dispatch: {}       # buton „Run workflow” și repornirea automată a buclei

permissions:
  contents: write             # ca să poată salva starea (state/live_state.json)
  actions: write              # ca bucla să se poată reporni singură

concurrency:
  group: apex-live            # o singură buclă odată; următoarea așteaptă la rând
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bucla live (un ciclu la 5 minute)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          PROP_BALANCE: ${{ vars.PROP_BALANCE }}
          PROP_ACCOUNT_SIZE: ${{ vars.PROP_ACCOUNT_SIZE }}
          PROP_FIRM: ${{ vars.PROP_FIRM }}
          PROP_PHASE: ${{ vars.PROP_PHASE }}
          PROP_CONTRACT_SIZES: ${{ vars.PROP_CONTRACT_SIZES }}
          PROP_RESUME: ${{ vars.PROP_RESUME }}
          LIVE_TELEGRAM: '1'
          STATE_PATH: state/live_state.json
        run: bash scripts/live-loop.sh
      - name: Pornește următoarea buclă
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/apex-live.yml/dispatches" -d '{"ref":"main"}' \
            && echo "Următoarea buclă e la rând."
