# Rulează Departamentul Prop (Forex, aur, indici) din oră în oră, non-stop, pe serverele GitHub (gratuit).
# Trimite pe Telegram doar la evenimente: semnal nou (cu lot și stop), închidere, fază trecută, plus un mesaj zilnic la ora 9.
# Variabile opționale (Settings → Secrets and variables → Actions → Variables):
#   PROP_BALANCE = soldul real al contului (dacă diferă de cel estimat), PROP_ACCOUNT_SIZE = mărimea contului (implicit 10000),
#   PROP_FIRM = FTMO_2STEP | FUNDEDNEXT_STELLAR_2STEP | THE5ERS_HIGH_STAKES | FTMO_1STEP, PROP_PHASE = 1, 2 sau 3 (3 = finanțat)
name: APEX live (Prop Forex)

on:
  schedule:
    - cron: '7 * * * *'      # în fiecare oră, la minutul 7 (după închiderea lumânărilor)
  workflow_dispatch: {}       # buton „Run workflow” pentru pornire manuală

permissions:
  contents: write             # ca să poată salva starea (state/live_state.json)

concurrency:
  group: apex-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ciclu Departament Prop
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          PROP_BALANCE: ${{ vars.PROP_BALANCE }}
          PROP_ACCOUNT_SIZE: ${{ vars.PROP_ACCOUNT_SIZE }}
          PROP_FIRM: ${{ vars.PROP_FIRM }}
          PROP_PHASE: ${{ vars.PROP_PHASE }}
          LIVE_TELEGRAM: '1'
          STATE_PATH: state/live_state.json
        run: node src/cron.js
      - name: Salvează starea
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add state/live_state.json
          if git diff --cached --quiet; then echo "Nicio schimbare de stare."; exit 0; fi
          git commit -m "stare live $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
