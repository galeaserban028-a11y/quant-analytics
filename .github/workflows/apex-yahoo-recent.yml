# Completează istoricul Forex cu zilele anului curent din lumânările orare Yahoo (rapid, aliniat ca live-ul).
name: APEX completare Forex (Yahoo)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/yahoo_recent.py --all --since $(date -u +%Y)-01-01 --out data/fx/dk
      - name: Salvează
        run: |
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add data/fx/dk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Forex: zilele anului curent din Yahoo $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 15 + 5)); done
          exit 1
